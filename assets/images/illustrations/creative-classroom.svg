<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 25 520 445" width="520" height="445" fill="none" role="img" aria-labelledby="desc-creative-classroom">
  <title id="desc-creative-classroom">Creative classroom arts and science discovery illustration</title>
  <desc>Young student painting on an easel and a student exploring nature with a magnifying glass, surrounded by joyful doodles and learning elements.</desc>

  <!-- Background Soft Floating Organic Shapes -->
  <g opacity="0.5">
    <path d="M150 120 C220 80 320 110 340 180 C360 250 280 320 200 320 C120 320 80 250 90 190 C100 130 130 130 150 120 Z" fill="#ffd25d" fill-opacity="0.25"/>
    <path d="M460 140 C530 170 550 250 510 310 C470 370 390 380 340 330 C290 280 320 200 370 160 C410 130 430 130 460 140 Z" fill="#dec8fe" fill-opacity="0.3"/>
  </g>

  <!-- Floating Sparkles, Brush Strokes & Doodles -->
  <g stroke="#704fe6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star top left -->
    <path d="M80 90 L83 99 L92 102 L83 105 L80 114 L77 105 L68 102 L77 99 Z" fill="#ffd25d" stroke="#ffd25d" stroke-width="1.5"/>
    <!-- Star top right -->
    <path d="M510 80 L514 90 L525 93 L514 96 L510 106 L506 96 L495 93 L506 90 Z" fill="#ff7675" stroke="#ff7675" stroke-width="1.5"/>
    <!-- Small star center -->
    <path d="M290 50 L292 57 L300 59 L292 61 L290 68 L288 61 L280 59 L288 57 Z" fill="#704fe6" stroke="#704fe6" stroke-width="1.5"/>
    <!-- Sparkle dot accents -->
    <circle cx="120" cy="70" r="3" fill="#dec8fe" stroke="none"/>
    <circle cx="430" cy="75" r="3.5" fill="#ffd25d" stroke="none"/>
    <circle cx="535" cy="220" r="3" fill="#48bb78" stroke="none"/>
    <circle cx="70" cy="230" r="3.5" fill="#ff7675" stroke="none"/>
    <!-- Paint splash droplets -->
    <circle cx="210" cy="115" r="4" fill="#ff7675" stroke="none"/>
    <circle cx="230" cy="95" r="3" fill="#ffd25d" stroke="none"/>
    <circle cx="245" cy="115" r="3.5" fill="#704fe6" stroke="none"/>
  </g>

  <!-- Floor Grounding Oval -->
  <ellipse cx="300" cy="435" rx="240" ry="32" fill="#f4f0ff"/>
  <ellipse cx="300" cy="435" rx="190" ry="22" fill="#ebe4fc"/>

  <!-- LEFT: Art Easel & Canvas -->
  <g id="art-easel" transform="translate(130, 160)">
    <!-- Wooden legs -->
    <line x1="80" y1="40" x2="10" y2="280" stroke="#d4a373" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="40" x2="150" y2="280" stroke="#d4a373" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="40" x2="80" y2="280" stroke="#b08968" stroke-width="6" stroke-linecap="round"/>
    <!-- Easel shelf -->
    <rect x="15" y="210" width="130" height="12" rx="4" fill="#bc6c25"/>

    <!-- Canvas Board -->
    <rect x="25" y="70" width="110" height="145" rx="8" fill="#ffffff" stroke="#704fe6" stroke-width="3"/>

    <!-- Artwork on Canvas (Sun, rainbow, hills) -->
    <!-- Sun -->
    <circle cx="48" cy="100" r="14" fill="#ffd25d"/>
    <!-- Sun rays -->
    <path d="M48 80 L48 76 M48 120 L48 124 M28 100 L24 100 M68 100 L72 100" stroke="#ffd25d" stroke-width="3" stroke-linecap="round"/>
    <!-- Rainbow arcs -->
    <path d="M40 160 Q 80 110, 120 160" stroke="#ff7675" stroke-width="6" fill="none"/>
    <path d="M48 165 Q 80 125, 112 165" stroke="#ffd25d" stroke-width="6" fill="none"/>
    <path d="M56 170 Q 80 140, 104 170" stroke="#48bb78" stroke-width="5" fill="none"/>
    <!-- Rolling green hill -->
    <path d="M26 195 Q 60 170, 95 190 T 134 195 L 134 213 L 26 213 Z" fill="#81c784"/>

    <!-- Paint jar on shelf -->
    <rect x="110" y="192" width="18" height="20" rx="3" fill="#704fe6"/>
    <rect x="108" y="190" width="22" height="4" rx="2" fill="#5b37d6"/>
    <!-- Paint brush in jar -->
    <line x1="120" y1="190" x2="132" y2="170" stroke="#d4a373" stroke-width="3"/>
    <path d="M132 170 L135 165 L131 166 Z" fill="#ff7675"/>
  </g>

  <!-- CENTER-LEFT CHARACTER: Child Artist holding brush & palette -->
  <g id="child-artist" transform="translate(60, 180)">
    <!-- Legs & Shoes -->
    <rect x="75" y="210" width="14" height="40" rx="6" fill="#704fe6"/>
    <rect x="100" y="210" width="14" height="40" rx="6" fill="#704fe6"/>
    <ellipse cx="80" cy="252" rx="12" ry="6" fill="#ff7675"/>
    <ellipse cx="109" cy="252" rx="12" ry="6" fill="#ff7675"/>

    <!-- Artist Smock / Apron (Warm yellow with paint stains) -->
    <rect x="65" y="125" width="60" height="92" rx="20" fill="#ffd25d"/>
    <!-- Smock pocket with cute brush sticking out -->
    <rect x="78" y="165" width="34" height="26" rx="6" fill="#ffe082"/>
    <circle cx="88" cy="155" r="4" fill="#ff7675"/>
    <circle cx="102" cy="158" r="3" fill="#48bb78"/>

    <!-- Arms -->
    <!-- Right arm extended painting on canvas -->
    <path d="M120 145 C 135 155, 145 160, 160 162" stroke="#ffd25d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="162" r="6" fill="#fcd9b8"/>
    <!-- Paintbrush in hand -->
    <line x1="160" y1="162" x2="175" y2="160" stroke="#d4a373" stroke-width="3" stroke-linecap="round"/>
    <path d="M175 160 L182 158 L177 163 Z" fill="#704fe6"/>

    <!-- Left arm holding wooden palette -->
    <path d="M70 145 C 55 160, 52 175, 62 185" stroke="#ffd25d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="185" r="6" fill="#fcd9b8"/>
    <!-- Paint Palette -->
    <ellipse cx="50" cy="190" rx="20" ry="14" fill="#d4a373"/>
    <circle cx="42" cy="186" r="3" fill="#ff7675"/>
    <circle cx="50" cy="183" r="3" fill="#704fe6"/>
    <circle cx="58" cy="188" r="3" fill="#48bb78"/>
    <circle cx="52" cy="196" r="3" fill="#ffd25d"/>

    <!-- Head & Neck -->
    <rect x="89" y="112" width="12" height="15" rx="6" fill="#fcd9b8"/>
    <ellipse cx="95" cy="88" rx="26" ry="28" fill="#fcd9b8"/>
    <!-- Face -->
    <ellipse cx="87" cy="86" rx="3.5" ry="4" fill="#1f2937"/>
    <ellipse cx="103" cy="86" rx="3.5" ry="4" fill="#1f2937"/>
    <circle cx="88.5" cy="84.5" r="1.2" fill="#ffffff"/>
    <circle cx="104.5" cy="84.5" r="1.2" fill="#ffffff"/>
    <ellipse cx="80" cy="94" rx="4.5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <ellipse cx="109" cy="94" rx="4.5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <!-- Cheerful smile -->
    <path d="M90 94 Q 95 101, 100 94" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Artist Beret Hat -->
    <path d="M68 80 C 68 62, 85 52, 98 52 C 118 52, 130 65, 126 80 Z" fill="#704fe6"/>
    <ellipse cx="98" cy="52" rx="4" ry="3" fill="#dec8fe"/>
  </g>

  <!-- RIGHT CHARACTER: Child exploring with magnifying glass & globe -->
  <g id="child-explorer" transform="translate(360, 180)">
    <!-- Legs & Shoes -->
    <rect x="70" y="210" width="14" height="40" rx="6" fill="#48bb78"/>
    <rect x="96" y="210" width="14" height="40" rx="6" fill="#48bb78"/>
    <ellipse cx="74" cy="252" rx="12" ry="6" fill="#ffd25d"/>
    <ellipse cx="104" cy="252" rx="12" ry="6" fill="#ffd25d"/>

    <!-- Torso (Lavender Sweater) -->
    <rect x="60" y="125" width="60" height="90" rx="22" fill="#dec8fe"/>

    <!-- Right arm holding large magnifying glass -->
    <path d="M65 145 C 45 160, 30 175, 20 190" stroke="#dec8fe" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="20" cy="190" r="6" fill="#ffd8be"/>
    <!-- Magnifying glass -->
    <g transform="translate(-10, 160)">
      <circle cx="25" cy="25" r="22" stroke="#704fe6" stroke-width="4" fill="#ffffff" fill-opacity="0.8"/>
      <line x1="41" y1="41" x2="56" y2="56" stroke="#ffd25d" stroke-width="6" stroke-linecap="round"/>
      <!-- Discovery butterfly inside lens -->
      <path d="M22 25 Q 16 18, 22 14 Q 28 18, 22 25" fill="#ff7675"/>
      <path d="M26 25 Q 32 18, 26 14 Q 20 18, 26 25" fill="#ffd25d"/>
      <line x1="24" y1="12" x2="24" y2="28" stroke="#1f2937" stroke-width="1.5"/>
    </g>

    <!-- Left arm gesturing excitedly -->
    <path d="M115 145 C 130 155, 142 165, 150 180" stroke="#dec8fe" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="180" r="6" fill="#ffd8be"/>

    <!-- Head & Neck -->
    <rect x="84" y="112" width="12" height="15" rx="6" fill="#ffd8be"/>
    <ellipse cx="90" cy="88" rx="26" ry="28" fill="#ffd8be"/>
    <!-- Face -->
    <ellipse cx="82" cy="86" rx="3.5" ry="4" fill="#1f2937"/>
    <ellipse cx="98" cy="86" rx="3.5" ry="4" fill="#1f2937"/>
    <circle cx="83.5" cy="84.5" r="1.2" fill="#ffffff"/>
    <circle cx="99.5" cy="84.5" r="1.2" fill="#ffffff"/>
    <ellipse cx="76" cy="94" rx="4.5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <ellipse cx="104" cy="94" rx="4.5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <!-- Curious happy smile -->
    <path d="M85 94 Q 90 101, 95 94" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Curly dark hair with headband -->
    <path d="M64 85 C 62 60, 78 52, 90 52 C 108 52, 118 64, 116 85 C 114 74, 108 65, 96 64 C 84 63, 72 70, 68 85 Z" fill="#2d3748"/>
    <!-- Yellow headband -->
    <path d="M68 76 C 75 66, 105 66, 112 76" stroke="#ffd25d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Little bow on headband -->
    <polygon points="106,66 112,62 110,70" fill="#ff7675"/>
    <polygon points="114,66 118,62 116,70" fill="#ff7675"/>
  </g>
</svg>