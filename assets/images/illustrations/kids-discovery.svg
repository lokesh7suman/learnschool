<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 25 520 445" width="520" height="445" fill="none" role="img" aria-labelledby="desc-kids-discovery">
  <title id="desc-kids-discovery">Joyful early learning discovery illustration with school kids, building blocks, and books</title>
  <desc>Two young school children exploring, reading an open picture book and building colorful wooden blocks with playful learning doodles.</desc>

  <!-- Background Soft Floating Doodles & Blobs -->
  <g opacity="0.6">
    <!-- Soft decorative organic backdrop shapes (semi-transparent) -->
    <path d="M480 120 C540 140 560 210 520 260 C480 310 410 320 370 270 C330 220 350 150 400 120 C430 100 460 110 480 120 Z" fill="#dec8fe" fill-opacity="0.25"/>
    <path d="M120 180 C180 140 250 170 270 230 C290 290 240 360 170 360 C100 360 70 300 80 240 C90 190 100 190 120 180 Z" fill="#ffd25d" fill-opacity="0.2"/>
  </g>

  <!-- Playful Floating Sparkles & Learning Doodles -->
  <g stroke="#704fe6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star top right -->
    <path d="M490 85 L495 97 L507 102 L495 107 L490 119 L485 107 L473 102 L485 97 Z" fill="#ffd25d" stroke="#ffd25d" stroke-width="1.5"/>
    <!-- Small star top left -->
    <path d="M110 130 L113 138 L121 141 L113 144 L110 152 L107 144 L99 141 L107 138 Z" fill="#704fe6" stroke="#704fe6" stroke-width="1.5"/>
    <!-- Star center top -->
    <path d="M310 60 L313 70 L323 73 L313 76 L310 86 L307 76 L297 73 L307 70 Z" fill="#ff7675" stroke="#ff7675" stroke-width="1.5"/>
    <!-- Loopy doodle -->
    <path d="M220 90 Q 235 70, 250 90 T 280 90" fill="none" stroke="#704fe6" stroke-dasharray="4 4"/>
    <!-- Sparkle dot accents -->
    <circle cx="170" cy="110" r="3" fill="#ffd25d" stroke="none"/>
    <circle cx="440" cy="90" r="3.5" fill="#dec8fe" stroke="none"/>
    <circle cx="525" cy="200" r="3" fill="#ff7675" stroke="none"/>
    <circle cx="85" cy="280" r="3" fill="#48bb78" stroke="none"/>
    <!-- Floating paper airplane -->
    <g transform="translate(420, 50) rotate(-10) scale(0.85)">
      <polygon points="0,20 45,0 15,35 15,22" fill="#704fe6"/>
      <polygon points="45,0 15,35 25,25" fill="#dec8fe"/>
      <path d="M-15 35 Q -5 40, 10 32" fill="none" stroke="#704fe6" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- Central Floor & Rug Grounding (Soft organic oval) -->
  <ellipse cx="300" cy="435" rx="230" ry="32" fill="#f4f0ff"/>
  <ellipse cx="300" cy="435" rx="190" ry="24" fill="#ebe4fc"/>

  <!-- LEFT CHARACTER: Child sitting & exploring an open picture book -->
  <g id="child-reading" transform="translate(110, 190)">
    <!-- Floor cushion / pouf -->
    <ellipse cx="85" cy="230" rx="65" ry="22" fill="#dec8fe"/>
    <ellipse cx="85" cy="225" rx="60" ry="18" fill="#cbb3fa"/>

    <!-- Legs & sneakers -->
    <path d="M60 215 C 60 225, 40 235, 30 235 C 22 235, 18 228, 24 222 C 32 215, 55 210, 60 215 Z" fill="#ff7675"/>
    <path d="M110 215 C 110 225, 130 235, 140 235 C 148 235, 152 228, 146 222 C 138 215, 115 210, 110 215 Z" fill="#ff7675"/>
    <ellipse cx="26" cy="230" rx="10" ry="6" fill="#ffffff"/>
    <ellipse cx="144" cy="230" rx="10" ry="6" fill="#ffffff"/>

    <!-- Child Body / Torso (Yellow hoodie) -->
    <rect x="55" y="115" width="60" height="75" rx="25" fill="#ffd25d"/>
    <!-- Collar -->
    <path d="M73 115 Q 85 125, 97 115" stroke="#e6b800" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Arms holding book -->
    <path d="M58 135 C 45 155, 48 180, 62 188" stroke="#ffd25d" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M112 135 C 125 155, 122 180, 108 188" stroke="#ffd25d" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Hands -->
    <circle cx="62" cy="188" r="8" fill="#fcd9b8"/>
    <circle cx="108" cy="188" r="8" fill="#fcd9b8"/>

    <!-- Open Picture Book -->
    <g transform="translate(50, 165)">
      <!-- Left Page -->
      <path d="M35 15 C 20 10, 5 12, 0 18 L 4 48 C 10 42, 22 40, 35 44 Z" fill="#ffffff" stroke="#704fe6" stroke-width="2"/>
      <!-- Right Page -->
      <path d="M35 15 C 50 10, 65 12, 70 18 L 66 48 C 60 42, 48 40, 35 44 Z" fill="#ffffff" stroke="#704fe6" stroke-width="2"/>
      <!-- Book spine & cover back -->
      <path d="M35 15 L 35 45" stroke="#704fe6" stroke-width="2.5"/>
      <path d="M-2 20 L 35 47 L 72 20" stroke="#704fe6" stroke-width="2.5" fill="none"/>
      <!-- Colorful page content (mini shapes in book) -->
      <circle cx="18" cy="28" r="5" fill="#ff7675"/>
      <rect x="10" y="36" width="16" height="3" rx="1.5" fill="#dec8fe"/>
      <polygon points="52,24 57,33 47,33" fill="#48bb78"/>
      <rect x="44" y="36" width="16" height="3" rx="1.5" fill="#ffd25d"/>
    </g>

    <!-- Head & Neck -->
    <rect x="79" y="102" width="12" height="16" rx="6" fill="#fcd9b8"/>
    <ellipse cx="85" cy="75" rx="28" ry="30" fill="#fcd9b8"/>
    <!-- Friendly smiling face -->
    <!-- Eyes -->
    <ellipse cx="76" cy="74" rx="3.5" ry="4" fill="#1f2937"/>
    <ellipse cx="94" cy="74" rx="3.5" ry="4" fill="#1f2937"/>
    <circle cx="77.5" cy="72.5" r="1.2" fill="#ffffff"/>
    <circle cx="95.5" cy="72.5" r="1.2" fill="#ffffff"/>
    <!-- Cheerful rosy cheeks -->
    <ellipse cx="70" cy="81" rx="5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <ellipse cx="100" cy="81" rx="5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <!-- Smile -->
    <path d="M80 82 Q 85 88, 90 82" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Playful Hair with topknot / curls -->
    <path d="M57 68 C 55 45, 75 38, 85 38 C 105 38, 115 50, 113 68 C 115 76, 112 82, 110 84 C 108 72, 106 62, 98 56 C 88 50, 70 54, 62 66 C 58 72, 57 78, 57 84 C 55 80, 56 72, 57 68 Z" fill="#4a2e18"/>
    <!-- Top bun / puff -->
    <ellipse cx="85" cy="35" rx="15" ry="14" fill="#4a2e18"/>
    <ellipse cx="85" cy="42" rx="7" ry="3" fill="#704fe6"/>
  </g>

  <!-- CENTER: Montessori Building Blocks & Sprout Plant -->
  <g id="learning-blocks" transform="translate(255, 300)">
    <!-- Toy Wooden Blocks Stack -->
    <!-- Block 1 (Base Violet) -->
    <g transform="translate(10, 70)">
      <rect x="0" y="0" width="46" height="46" rx="8" fill="#704fe6"/>
      <rect x="5" y="5" width="36" height="36" rx="5" fill="#8565f4"/>
      <text x="23" y="29" font-family="Quicksand, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    </g>
    <!-- Block 2 (Base Yellow) -->
    <g transform="translate(62, 70)">
      <rect x="0" y="0" width="46" height="46" rx="8" fill="#ffd25d"/>
      <rect x="5" y="5" width="36" height="36" rx="5" fill="#ffe082"/>
      <text x="23" y="29" font-family="Quicksand, system-ui, sans-serif" font-size="20" font-weight="700" fill="#704fe6" text-anchor="middle">B</text>
    </g>
    <!-- Block 3 (Base Mint) -->
    <g transform="translate(36, 18)">
      <rect x="0" y="0" width="46" height="46" rx="8" fill="#48bb78"/>
      <rect x="5" y="5" width="36" height="36" rx="5" fill="#68d391"/>
      <text x="23" y="29" font-family="Quicksand, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
    </g>
    <!-- Triangle Top Block (Coral) -->
    <polygon points="59,-22 36,14 82,14" fill="#ff7675"/>
    <polygon points="59,-12 43,10 75,10" fill="#ff9f9f"/>
  </g>

  <!-- Potted Discovery Sprout (Nature & Science) -->
  <g id="potted-plant" transform="translate(225, 340)">
    <!-- Terracotta pot -->
    <polygon points="12,45 38,45 44,80 6,80" fill="#ffd25d"/>
    <rect x="4" y="40" width="42" height="10" rx="3" fill="#e6b800"/>
    <!-- Stem and fresh green leaves -->
    <path d="M25 40 Q 25 20, 20 5" stroke="#48bb78" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M22 25 C 10 20, 8 10, 18 10 C 24 10, 24 18, 22 25 Z" fill="#48bb78"/>
    <path d="M23 16 C 35 12, 38 2, 28 2 C 22 2, 22 10, 23 16 Z" fill="#38a169"/>
    <!-- Tiny heart above sprout -->
    <path d="M20 -4 C 18 -9, 14 -7, 14 -4 C 14 0, 20 4, 20 4 C 20 4, 26 0, 26 -4 C 26 -7, 22 -9, 20 -4 Z" fill="#ff7675"/>
  </g>

  <!-- RIGHT CHARACTER: Child building & reaching excitedly -->
  <g id="child-building" transform="translate(370, 160)">
    <!-- Child Body / Torso (Lavender & Indigo Dungarees/Overalls) -->
    <!-- Striped T-Shirt -->
    <rect x="50" y="145" width="56" height="60" rx="20" fill="#dec8fe"/>
    <!-- Overalls straps & pants -->
    <path d="M48 185 C 48 175, 54 165, 62 165 L 94 165 C 102 165, 108 175, 108 185 L 110 240 C 110 245, 100 248, 92 248 L 88 215 L 68 215 L 64 248 C 56 248, 46 245, 46 240 Z" fill="#704fe6"/>
    <!-- Overalls pocket -->
    <rect x="68" y="180" width="20" height="16" rx="4" fill="#5b37d6"/>

    <!-- Sneakers -->
    <ellipse cx="56" cy="254" rx="14" ry="7" fill="#ffd25d"/>
    <ellipse cx="100" cy="254" rx="14" ry="7" fill="#ffd25d"/>
    <rect x="50" y="252" width="12" height="4" rx="2" fill="#ffffff"/>
    <rect x="94" y="252" width="12" height="4" rx="2" fill="#ffffff"/>

    <!-- Left Arm resting forward toward blocks -->
    <path d="M52 165 C 30 185, 10 215, -5 230" stroke="#dec8fe" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="-5" cy="230" r="7" fill="#ffd8be"/>

    <!-- Right Arm raised joyfully celebrating the tower -->
    <path d="M104 165 C 120 145, 135 120, 142 95" stroke="#dec8fe" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="142" cy="95" r="7" fill="#ffd8be"/>
    <!-- Star sparkle in raised hand -->
    <path d="M145 75 L 148 83 L 156 86 L 148 89 L 145 97 L 142 89 L 134 86 L 142 83 Z" fill="#ffd25d"/>

    <!-- Head & Neck -->
    <rect x="72" y="132" width="12" height="16" rx="6" fill="#ffd8be"/>
    <ellipse cx="78" cy="105" rx="26" ry="28" fill="#ffd8be"/>
    <!-- Face -->
    <ellipse cx="70" cy="104" rx="3.5" ry="4" fill="#1f2937"/>
    <ellipse cx="86" cy="104" rx="3.5" ry="4" fill="#1f2937"/>
    <circle cx="71.5" cy="102.5" r="1.2" fill="#ffffff"/>
    <circle cx="87.5" cy="102.5" r="1.2" fill="#ffffff"/>
    <!-- Rosy cheeks -->
    <ellipse cx="64" cy="111" rx="5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <ellipse cx="92" cy="111" rx="5" ry="3" fill="#ff7675" fill-opacity="0.45"/>
    <!-- Big joyful smile -->
    <path d="M72 112 Q 78 120, 84 112" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Modern short tousled hair -->
    <path d="M52 102 C 50 78, 65 68, 78 68 C 95 68, 106 78, 104 100 C 104 104, 102 106, 98 106 C 96 90, 92 84, 82 82 C 72 80, 60 86, 56 102 Z" fill="#2d3748"/>
    <!-- Little playful tufts -->
    <path d="M68 68 Q 72 60, 78 68 Q 84 58, 88 68" stroke="#2d3748" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>