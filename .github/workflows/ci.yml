name: LearnSchool CI & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-checks:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate Theme JSON Schema
        run: npm run lint:schema

      - name: Lint Block Template Grammar (AST)
        run: npm run lint:blocks

      - name: Lint Stylesheet (Stylelint)
        run: npm run lint:css

      - name: Lint package.json
        run: npm run lint:json

      - name: PHP Coding Standards (WPCS)
        run: composer run lint

      - name: PHPStan Static Analysis (Level 8)
        run: composer run analyze

  playground-preview:
    name: WordPress Playground PR Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: static-checks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Playground Preview
        uses: WordPress/action-wp-playground-pr-preview@v4

  release-packaging:
    name: Build Production Release Package
    runs-on: ubuntu-latest
    needs: static-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Dependencies
        run: |
          npm ci
          composer install --prefer-dist --no-progress

      - name: Bundle Production Package
        run: npm run bundle

      - name: Upload Theme Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnschool-release
          path: ../learnschool.zip
